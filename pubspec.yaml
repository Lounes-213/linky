name: linky
description: "Linky - Social Commerce Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  firebase_messaging: ^15.2.1
  firebase_analytics: ^11.4.1
  
  # Google Sign-In
  google_sign_in: ^6.2.1
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Storage
  flutter_secure_storage: ^9.2.4
  
  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  
  # Utils
  intl: 0.20.2
  uuid: ^4.5.1
  
  # UI
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
